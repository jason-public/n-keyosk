<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 및 태블릿 화면 최적화 (스마트폰 노치 영역 대응 및 부드러운 스케일링) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- 브라우저 상단 테마 색상 (다크 모드 일체감) -->
    <meta name="theme-color" content="#000000" />
    
    <!-- 웹 애플리케이션 및 검색 최적화 타이틀 -->
    <title>남양주 어르신 키오스크 연습센터</title>
    
    <!-- 모바일 웹앱 전체화면 설정 지원 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- 데스크탑 화면 최적화 스타일: 데스크탑(PC/노트북 1024px 이상)에서 너무 확대되어 보이지 않도록 20% 축소(80% 배율) 적용 -->
    <style>
      @media (min-width: 1024px) {
        html {
          zoom: 0.8;
        }
      }
    </style>
  </head>
  <body class="bg-black text-white antialiased selection:bg-[#6F3FF5] selection:text-white">
    <!-- 리액트 애플리케이션이 마운트되는 루트 엘리먼트 -->
    <div id="root"></div>
    
    <!-- 메인 엔트리 스크립트 실행 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
